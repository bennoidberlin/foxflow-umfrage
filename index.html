<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}

<script>
(function(){
"use strict";
var params = new URLSearchParams(location.search);
var IS_TEST = params.get("test") === "1";
var QUELLE = (params.get("q") || "direkt").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,40) || "direkt";
var SAVE_URL = "https://leadlogic.app.n8n.cloud/webhook/foxflow-umfrage-speichern";
var IG_URL = "https://www.instagram.com/foxflow_unterrichtsalltag";
var FB_URL = "https://www.facebook.com/people/FoxFlow/61575349643938/";
var PDF_URL = "https://drive.google.com/file/d/1kWGGZZvgATnZ24ACTLx29xBBIxbNt-6i/view";
var SHARE_URL = "https://leadlogic.app.n8n.cloud/webhook/foxflow-umfrage?q=weiter";
var STORE = "foxflow_umfrage_v1";

function uid(){
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
}
var state = { sitzung: uid(), schritt: 0, start: Date.now(), einwilligung: null, a: {}, saved: -1, dirty: false, fertig: false };
var NUDGE = { "f3":1, "f5":1, "f7":1 }, nudged = {};
try {
  var raw = localStorage.getItem(STORE);
  if (raw) { var old = JSON.parse(raw); if (old && old.sitzung && !old.fertig && (Date.now() - old.start) < 7*24*3600*1000) state = old; }
} catch(e){}
function persist(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

var KRAFT = ["Unruhe und Störungen in der Klasse","Grenzen setzen ohne schlechtes Gewissen","Abends nicht abschalten können","Anspannung oder Gereiztheit im Unterricht","Schwierige Gespräche mit Eltern","Konflikte mit Kolleg:innen oder Schulleitung","Selbstkritik, Gefühl nie genug","Arbeitsmenge und Zeitdruck","Etwas anderes"];

var Q = [
  { id:"start", type:"start" },
  { id:"f1", type:"multi1", nr:1, title:"Kurz zu dir", parts:[
      { key:"f1_stufe", label:"In welcher Schulstufe unterrichtest du hauptsächlich?", kind:"radio", options:["Sek I","Sek II","beides","andere"] },
      { key:"f1_jahre", label:"Wie lange unterrichtest du schon?", kind:"radio", options:["unter 3","3–10","über 10"], display:["unter 3 Jahre","3–10 Jahre","über 10 Jahre"] },
      { key:"f1_quer", label:"", kind:"check", options:["Ich bin Quereinsteiger:in"] } ] },
  { id:"f2", type:"choice", nr:2, key:"f2", multi:true, max:3, title:"Was kostet dich im Schulalltag am meisten Kraft?", hint:"Wähle bis zu drei.", options:KRAFT, other:{ when:"Etwas anderes", key:"f2_anderes", ph:"Was genau?" } },
  { id:"f3", type:"open", nr:3, key:"f3", title:"Erzähl von einer Situation der letzten Wochen, die wirklich schwierig war.", hint:"Was ist passiert, und wann hast du gemerkt, dass es kippt? Sprich ruhig einfach drauflos. Bitte keine Namen von Schüler:innen." },
  { id:"f4", type:"choice", nr:4, key:"f4", multi:false, title:"Wenn du nur eins davon lösen könntest – was wäre es?", dynamic:true },
  { id:"f5", type:"open", nr:5, key:"f5", short:true, title:"Was sagst du dir innerlich in solchen Momenten?", hint:"Ein Satz reicht." },
  { id:"f6", type:"choice", nr:6, key:"f6", multi:true, title:"Was hast du schon ausprobiert?", hint:"Mehrere möglich.", options:["Bücher/Podcasts","Staatliche Fortbildung","Coaching/Supervision","Instagram/YouTube-Accounts","Austausch im Kollegium","Achtsamkeits-App","Noch nichts"], exclusive:"Noch nichts", follow:{ key:"f6_nicht", label:"Was hat nicht funktioniert? (freiwillig, ein Satz)" } },
  { id:"f7", type:"open", nr:7, key:"f7", title:"Was wäre für dich eine echte Erleichterung?", hint:"Woran würdest du merken, dass es funktioniert?" },
  { id:"f8", type:"multi1", nr:8, title:"Hilfe suchen", parts:[
      { key:"f8_gesucht", label:"Hast du schon mal aktiv Hilfe gesucht (Kurs, Coaching, Buch …)?", kind:"radio", options:["Ja","Nein"] },
      { key:"f8_warum", when:["f8_gesucht","Ja"], label:"Was hat nicht (genug) geholfen – woran lag es?", kind:"check", options:["Zu theoretisch","Passte nicht zu meinem Schulalltag","Zu allgemein, nicht auf mich zugeschnitten","Keine Zeit, dranzubleiben","Hat nur kurz gewirkt","Zu teuer für das, was es gebracht hat","Zu esoterisch","Hat mir eigentlich gut geholfen","Etwas anderes"] },
      { key:"f8_warum_text", when:["f8_gesucht","Ja"], label:"Magst du kurz erzählen, was gefehlt hat? (freiwillig)", kind:"text" },
      { key:"f8_blockaden", when:["f8_gesucht","Nein"], label:"Was hat dich abgehalten oder hält dich ab?", kind:"check", options:["Keine Zeit","Kosten","Passt nicht zu meiner Schule","Zu theoretisch","Zu esoterisch","Schlechtes Gewissen, mir Zeit für mich zu nehmen","Weiß nicht, wo","Etwas anderes"] } ] },
  { id:"f9", type:"multi1", nr:9, title:"Was würde dir helfen?", parts:[
      { key:"f9_format", label:"Welche Form würde dir am meisten helfen? (bis zu zwei)", kind:"check", max:2, options:["Kurze Impulse","Online-Kurs im eigenen Tempo","Online-Gruppe mit Live-Terminen","1:1-Coaching","Workshop/Studientag an der Schule","Buch/Arbeitsheft"], display:["Kurze Impulse (Instagram, Newsletter)","Online-Kurs im eigenen Tempo","Online-Gruppe mit Live-Terminen","1:1-Coaching","Workshop/Studientag an der Schule","Buch/Arbeitsheft"] },
      { key:"f9_zahler", label:"Wer würde so etwas bezahlen?", kind:"radio", options:["Ich selbst","Schule/Fortbildungsbudget","Beides denkbar","Weiß nicht"] } ] },
  { id:"f10", type:"choice", nr:10, key:"f10", multi:true, title:"Wo holst du dir Impulse für deinen Beruf?", hint:"Mehrere möglich.", options:["Instagram","Facebook-Gruppen","YouTube","Podcasts","LinkedIn","TikTok","Newsletter","Kollegium","Fortbildungsportale"] },
  { id:"f11", type:"contact", nr:11, title:"Darf ich dich nochmal kontaktieren?", hint:"Ganz freiwillig. Ohne Häkchen bleibst du anonym." },
  { id:"ende", type:"end" }
];
var TOTAL = 11;
var SAVE_AFTER = { "f3":1, "f7":1 };

var $screen = document.getElementById("screen"), $next = document.getElementById("next"), $back = document.getElementById("back");
if (IS_TEST) document.getElementById("testbox").classList.remove("hide");

function el(tag, attrs, kids){
  var n = document.createElement(tag); attrs = attrs || {};
  for (var k in attrs){ if (k === "text") n.textContent = attrs[k]; else if (k === "html") n.innerHTML = attrs[k]; else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]); }
  (kids || []).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}
function arr(key){ var v = state.a[key]; return Array.isArray(v) ? v : []; }
function setA(key, val){ state.a[key] = val; state.dirty = true; persist(); }

function optionButton(label, on, radio, onclick, disabled){
  var b = el("button", { type:"button", "class":"opt" + (radio ? " radio" : "") + (on ? " on" : ""), "aria-pressed": on ? "true" : "false", onclick:onclick }, [ el("span", { "class":"box" }), el("span", { text:label }) ]);
  if (disabled) b.setAttribute("disabled", "disabled");
  return b;
}

function renderChoiceList(container, key, options, display, multi, max, exclusive){
  var box = el("div", { "class":"opts" });
  options.forEach(function(o, i){
    var sel = multi ? arr(key).indexOf(o) > -1 : state.a[key] === o;
    var full = multi && max && arr(key).length >= max && !sel;
    box.appendChild(optionButton(display ? display[i] : o, sel, !multi, function(){
      if (multi){
        var cur = arr(key).slice(), idx = cur.indexOf(o);
        if (idx > -1) cur.splice(idx,1);
        else {
          if (exclusive && o === exclusive) cur = [];
          else if (exclusive) { var ex = cur.indexOf(exclusive); if (ex > -1) cur.splice(ex,1); }
          if (!max || cur.length < max) cur.push(o);
        }
        setA(key, cur);
      } else { setA(key, state.a[key] === o ? null : o); }
      render();
    }, full));
  });
  container.appendChild(box);
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, recOn = false;
function stopRec(){ if (rec && recOn){ try { rec.stop(); } catch(e){} } recOn = false; }
function micBlock(textarea, key){
  var frag = document.createDocumentFragment();
  if (SR){
    var btn = el("button", { type:"button", "class":"mic" });
    var setLabel = function(){ btn.innerHTML = (recOn ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Fertig gesprochen' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>Antwort einsprechen'); btn.classList.toggle("rec", recOn); };
    setLabel();
    btn.addEventListener("click", function(){
      if (recOn){ stopRec(); setLabel(); return; }
      try {
        rec = new SR(); rec.lang = "de-DE"; rec.continuous = true; rec.interimResults = true;
        var baseText = textarea.value ? textarea.value.replace(/\s*$/, " ") : "";
        var finals = "";
        rec.onresult = function(ev){
          var interim = "";
          for (var i = ev.resultIndex; i < ev.results.length; i++){
            if (ev.results[i].isFinal) finals += ev.results[i][0].transcript + " ";
            else interim += ev.results[i][0].transcript;
          }
          textarea.value = (baseText + finals + interim).replace(/\s+$/, interim ? "" : " ");
          setA(key, textarea.value.trim());
        };
        rec.onerror = function(ev){ recOn = false; setLabel(); if (ev && (ev.error === "not-allowed" || ev.error === "service-not-allowed")) showTip(true); };
        rec.onend = function(){ recOn = false; setLabel(); setA(key, textarea.value.trim()); };
        rec.start(); recOn = true; setLabel();
      } catch(e){ recOn = false; setLabel(); showTip(true); }
    });
    frag.appendChild(btn);
  }
  var tip = el("p", { "class":"small", text: SR ? "Du siehst deinen Text sofort und kannst ihn danach noch ändern. Alternativ: Mikrofon-Taste auf deiner Handy-Tastatur." : "Tipp: Tippe ins Feld und nutze das Mikrofon auf deiner Handy-Tastatur – dann kannst du einfach sprechen." });
  function showTip(blocked){ if (blocked) tip.textContent = "Das Mikrofon ist hier gesperrt. Kein Problem: Tippe ins Feld und nutze das Mikrofon auf deiner Handy-Tastatur."; }
  frag.appendChild(tip);
  return frag;
}

function f4Optionen(){
  var o = arr("f2").filter(function(x){ return x !== "Etwas anderes"; });
  if (arr("f2").indexOf("Etwas anderes") > -1 && state.a.f2_anderes) o.push(state.a.f2_anderes.slice(0,80));
  return o;
}
function ueberspringen(q){
  if (q.id !== "f4") return false;
  var o = f4Optionen();
  if (o.length === 1){ state.a.f4 = o[0]; return true; }
  return false;
}
function header(q){
  var kids = [ el("h2", { text:q.title }) ];
  if (q.hint) kids.push(el("p", { "class":"hint", text:q.hint }));
  return kids;
}

function render(){
  stopRec();
  var q = Q[state.schritt];
  $screen.innerHTML = "";
  var nr = q.nr || (q.type === "end" ? TOTAL : 0);
  document.getElementById("count").textContent = q.nr ? ("Frage " + q.nr + " von " + TOTAL) : "";
  document.getElementById("bar").style.width = (q.type === "end" ? 100 : Math.round((nr / TOTAL) * 100)) + "%";
  document.querySelector(".nav").classList.toggle("hide", q.type === "end");
  $back.classList.toggle("hide", state.schritt === 0 || q.type === "end");
  $next.classList.remove("hide");
  $next.disabled = false;

  if (q.type === "start"){
    $screen.appendChild(el("h1", { text:"Hi, ich bin Maria – selbst Lehrerin." }));
    $screen.appendChild(el("p", { text:"Ich will verstehen, was Lehrkräfte im Schulalltag wirklich belastet – damit das, was ich entwickle, im echten Unterricht hilft." }));
    $screen.appendChild(el("p", { text:"11 kurze Fragen, ca. 5 Minuten. Bei den offenen Fragen kannst du tippen oder einfach reinsprechen. Es gibt keine falschen Antworten." }));
    $screen.appendChild(el("p", { "class":"hint", text:"Als Dankeschön bekommst du am Ende den „20-Sekunden-Reset“ für den Moment, in dem es kippt." }));
    var cb = el("input", { type:"checkbox", id:"cons" }); cb.checked = !!state.einwilligung;
    cb.addEventListener("change", function(){ state.einwilligung = cb.checked ? new Date().toISOString() : null; persist(); $next.disabled = !cb.checked; });
    $screen.appendChild(el("label", { "class":"consent", "for":"cons" }, [ cb, el("span", { text:"Ich bin einverstanden, dass meine Antworten zur Entwicklung von FoxFlow gespeichert und ausgewertet werden. Zitate werden nur ohne Namen verwendet. Ich kann die Einwilligung jederzeit widerrufen." }) ]));
    $screen.appendChild(datenschutz());
    $next.textContent = "Los geht's";
    $next.disabled = !cb.checked;
    return;
  }

  if (q.type === "end"){
    $next.classList.add("hide");
    document.getElementById("count").textContent = "Fertig";
    $screen.appendChild(el("h1", { text:"Danke dir! 🙏" }));
    $screen.appendChild(el("p", { text:"Deine Antworten sind angekommen. Sie helfen mir sehr." }));
    var reset = el("div", { "class":"reset" }, [
      el("h2", { text:"Dein 20-Sekunden-Reset" }),
      el("p", { "class":"hint", text:"Für den Moment, in dem es kippt: vor der Klassentür, nach einer Störung, vor einem schwierigen Gespräch." }),
      el("ol", {}, [
        el("li", { html:"<b>Ankommen:</b> Füße spüren, Schultern sinken lassen." }),
        el("li", { html:"<b>Doppelt einatmen:</b> durch die Nase ein – oben noch einen kleinen Atemzug drauf." }),
        el("li", { html:"<b>Lang ausatmen:</b> langsam durch den Mund, wie durch einen Strohhalm." }),
        el("li", { html:"<b>Noch einmal</b> – ganz weich, ohne Kraft." }),

    var soc = el("div", { "class":"soc" });
    soc.appendChild(el("a", { href:IG_URL, target:"_blank", rel:"noopener", html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Instagram' }));
    soc.appendChild(el("a", { href:FB_URL, target:"_blank", rel:"noopener", html:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v9h4v-9H17l.5-4h-4V8.8c0-.5.3-.8.5-.8z"/></svg>Facebook' }));
    $screen.appendChild(el("div", { "class":"follow" }, [
      el("h2", { text:"Magst du FoxFlow folgen? 🦊" }),
      el("p", { text:"Auf Instagram und Facebook teile ich die Ergebnisse dieser Umfrage – und nach und nach ganz viel für deinen Schulalltag: kleine Übungen, ehrliche Geschichten aus dem Klassenzimmer und Ideen, die sofort helfen." }),
      el("p", { text:"Ganz ehrlich: Gerade ist dort noch nicht viel zu sehen, ich stehe noch ganz am Anfang 🙈. Umso mehr würde es mir bedeuten, wenn du jetzt schon dabei bist. Danke von Herzen für deine Unterstützung! 💛" }),
      soc ]));
    var ask = el("div", { "class":"ask" }, [
      el("h2", { text:"Eine kleine Bitte noch 💛" }),
      el("p", { text:"Kennst du Kolleginnen oder Kollegen, denen es ähnlich geht? Dann würde ich mich riesig freuen, wenn du den Link weitergibst." }),
      el("p", { text:"Jede einzelne Antwort hilft mir, etwas zu bauen, das im echten Schulalltag wirklich trägt. Danke, dass du dabei bist! 🦊" }),
      el("p", { text:"Und ganz nebenbei: Jede Weiterleitung bringt dir ganz viele gute Karma-Punkte ✨😉" })
    ]);
    var share = el("button", { type:"button", "class":"sharebtn", text:"Link an Kolleg:innen schicken 💌" });
    ask.appendChild(share);
    share.addEventListener("click", function(){
      var text = "Ich hab gerade bei einer kurzen Umfrage von Maria mitgemacht. Sie ist selbst Lehrerin und möchte wissen, was uns im Schulalltag wirklich belastet. Dauert 5 Minuten, man kann auch einfach reinsprechen, und am Ende gibt es einen 20-Sekunden-Reset als Dankeschön 💛 ";
      if (navigator.share){ navigator.share({ title:"Umfrage für Lehrkräfte", text:text, url:SHARE_URL }).catch(function(){}); }
      else { location.href = "https://wa.me/?text=" + encodeURIComponent(text + SHARE_URL); }
    });
    $screen.appendChild(ask);
    $screen.appendChild(el("p", { "class":"small", text:"Wenn du der Kontaktaufnahme zugestimmt hast, melde ich mich. Die Ergebnisse der Umfrage teile ich auf Instagram und Facebook, sobald genug Antworten da sind." }));
    return;
  }

  $next.textContent = state.schritt === Q.length - 2 ? "Absenden" : "Weiter";
  header(q).forEach(function(n){ $screen.appendChild(n); });

  if (q.type === "choice"){
    var options = q.options;
    if (q.dynamic){
      options = f4Optionen();
      if (!options.length) options = KRAFT.slice(0, 8);
    }
    renderChoiceList($screen, q.key, options, null, q.multi, q.max, q.exclusive);
    if (q.other && arr(q.key).indexOf(q.other.when) > -1){
      var inp = el("input", { type:"text", placeholder:q.other.ph, maxlength:"200" }); inp.value = state.a[q.other.key] || "";
      inp.addEventListener("input", function(){ setA(q.other.key, inp.value); });
      $screen.appendChild(inp);
    }
    if (q.follow && arr(q.key).length && arr(q.key).indexOf("Noch nichts") === -1){
      $screen.appendChild(el("div", { "class":"sub", text:"Freiwillig" }));
      var ta = el("textarea", { placeholder:q.follow.label, maxlength:"2000", style:"min-height:90px" }); ta.value = state.a[q.follow.key] || "";
      ta.addEventListener("input", function(){ setA(q.follow.key, ta.value); });
      $screen.appendChild(ta);
      $screen.appendChild(micBlock(ta, q.follow.key));
    }
  }
  if (q.type === "multi1"){
    q.parts.forEach(function(p){
      if (p.when && state.a[p.when[0]] !== p.when[1]) return;
      if (p.kind === "text"){
        $screen.appendChild(el("div", { "class":"sub", text:p.label }));
        var pt = el("textarea", { placeholder:"Hier tippen oder einsprechen …", maxlength:"2000", style:"min-height:90px" }); pt.value = state.a[p.key] || "";
        pt.addEventListener("input", function(){ setA(p.key, pt.value); });
        $screen.appendChild(pt);
        $screen.appendChild(micBlock(pt, p.key));
        return;
      }
      if (p.label) $screen.appendChild(el("div", { "class":"sub", text:p.label }));
      if (p.kind === "radio") renderChoiceList($screen, p.key, p.options, p.display, false);
      else if (p.options.length === 1){
        var on = state.a[p.key] === true;
        var b = el("div", { "class":"opts" }, [ optionButton(p.options[0], on, false, function(){ setA(p.key, !on); render(); }) ]);
        $screen.appendChild(b);
      } else renderChoiceList($screen, p.key, p.options, p.display, true, p.max);
    });
  }
  if (q.type === "open"){
    var t = el("textarea", { placeholder: q.short ? "z. B. „Ich krieg das einfach nicht hin.“" : "Hier tippen oder unten auf „Antwort einsprechen“ …", maxlength:"6000" });
    if (q.short) t.style.minHeight = "100px";
    t.value = state.a[q.key] || "";
    t.addEventListener("input", function(){ setA(q.key, t.value); });
    $screen.appendChild(t);
    $screen.appendChild(micBlock(t, q.key));
  }
  if (q.type === "contact"){
    renderChoiceList($screen, "f11_kontakt_fuer", ["Gespräch","Pilotgruppe"], ["Ja, für ein 20-Minuten-Gespräch","Ja, wenn die Pilotgruppe startet"], true);
    var willKontakt = arr("f11_kontakt_fuer").length > 0;
    $screen.appendChild(el("div", { "class":"sub", text: willKontakt ? "Vor- und Nachname *" : "Vor- und Nachname (freiwillig)" }));
    var vn = el("input", { type:"text", id:"f11vn", placeholder:"Vor- und Nachname", maxlength:"120", autocomplete:"name" }); vn.value = state.a.f11_name || "";
    vn.addEventListener("input", function(){ setA("f11_name", vn.value); hideKontaktFehler(); });
    $screen.appendChild(vn);
    if (willKontakt){
      $screen.appendChild(el("div", { "class":"sub", text:"Deine E-Mail-Adresse *" }));
      var em = el("input", { type:"email", id:"f11em", placeholder:"name@beispiel.de", maxlength:"120", autocomplete:"email", inputmode:"email" }); em.value = state.a.f11_email || "";
      em.addEventListener("input", function(){ setA("f11_email", em.value); hideKontaktFehler(); });
      $screen.appendChild(em);
      $screen.appendChild(el("div", { "class":"sub", text:"Handynummer (freiwillig, z. B. für WhatsApp)" }));
      var hn = el("input", { type:"tel", id:"f11hn", placeholder:"0151 …", maxlength:"30", autocomplete:"tel", inputmode:"tel" }); hn.value = state.a.f11_handy || "";
      hn.addEventListener("input", function(){ setA("f11_handy", hn.value); });
      $screen.appendChild(hn);
      $screen.appendChild(el("p", { "class":"small", text:"Nur für diesen Zweck. Kein Newsletter, keine Weitergabe." }));
    }
    $screen.appendChild(el("p", { id:"kontaktfehler", "class":"err" }));
    $screen.appendChild(el("div", { "class":"sub", text:"Möchtest du mir sonst noch etwas sagen? (freiwillig)" }));
    var so = el("textarea", { placeholder:"…", maxlength:"4000", style:"min-height:90px" }); so.value = state.a.f11_sonstiges || "";
    so.addEventListener("input", function(){ setA("f11_sonstiges", so.value); });
    $screen.appendChild(so);
    $screen.appendChild(micBlock(so, "f11_sonstiges"));
  }
  window.scrollTo(0,0);
}

function emailOk(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || "").trim()); }
function kontaktFehler(){
  if (!arr("f11_kontakt_fuer").length) return "";
  if (String(state.a.f11_name || "").trim().split(/\s+/).filter(function(x){ return x.length > 0; }).length < 2) return "Damit wir dich zuordnen und kontaktieren können, brauchen wir deinen Vor- und Nachnamen.";
  if (!emailOk(state.a.f11_email)) return "Bitte gib eine gültige E-Mail-Adresse an, damit wir dich erreichen können.";
  return "";
}
function hideKontaktFehler(){ var e = document.getElementById("kontaktfehler"); if (e) e.style.display = "none"; }
function datenschutz(){
  return el("details", { id:"ds" }, [
    el("summary", { text:"Datenschutz – kurz erklärt" }),
    el("p", { text:"Verantwortlich: LeadLogic GmbH, Schönefeld (Amtsgericht Cottbus, HRB 15138), Geschäftsführer Benjamin Höschele. Kontakt über leadlogic.de." }),
    el("p", { text:"Zweck: Entwicklung von Angeboten für Lehrkräfte (FoxFlow) und deren Bekanntmachung. Zitate nur ohne Namen. Rechtsgrundlage ist deine Einwilligung (Art. 6 Abs. 1 lit. a DSGVO); du kannst sie jederzeit widerrufen." }),
    el("p", { text:"Was gespeichert wird: deine Antworten, Zeitpunkt, Gerätetyp und über welchen Link du kamst. Name und Kontakt nur, wenn du sie freiwillig angibst. Bitte keine Gesundheitsangaben und keine Namen von Schüler:innen." }),
    el("p", { text:"Empfänger: unser Automatisierungsdienst (n8n) und unsere Datenbank (Airtable, USA). Die Spracheingabe nutzt die Diktierfunktion deines Browsers bzw. Handys (z. B. Apple oder Google); wir speichern keine Tonaufnahmen, nur den Text. Logo und Dankeschön-PDF werden über Google Drive geladen." }),
    el("p", { text:"Speicherdauer: höchstens 24 Monate, Kontaktdaten bis zu deinem Widerruf. Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung, Widerspruch, Datenübertragbarkeit und Beschwerde bei einer Datenschutz-Aufsichtsbehörde." })
  ]);
}
document.getElementById("dslink").addEventListener("click", function(ev){ ev.preventDefault(); if (state.schritt !== 0){ state.schritt = 0; persist(); render(); } var d = document.getElementById("ds"); if (d){ d.open = true; d.scrollIntoView({behavior:"smooth"}); } });

function geraet(){ var w = Math.min(screen.width, screen.height); var ua = navigator.userAgent || ""; if (/iPad|Tablet/i.test(ua) || (w >= 600 && /Mobi|Android/i.test(ua))) return "Tablet"; if (/Mobi|iPhone|Android/i.test(ua) || w < 600) return "Handy"; return "Computer"; }
function payload(status){
  return { sitzung: state.sitzung, status: status, test: IS_TEST, quelle: QUELLE, einwilligung: state.einwilligung, schritt: state.schritt, dauer: Math.round((Date.now() - state.start) / 1000), geraet: geraet(), antworten: state.a };
}
function save(status){
  if (!state.einwilligung) return Promise.resolve(true);
  var body = JSON.stringify(payload(status));
  return fetch(SAVE_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body:body, keepalive:true })
    .then(function(r){ if (r.ok){ state.dirty = false; state.saved = state.schritt; persist(); return true; } return false; })
    .catch(function(){ return false; });
}
window.addEventListener("pagehide", function(){
  if (!state.dirty || !state.einwilligung || state.fertig || state.schritt < 2) return;
  try { navigator.sendBeacon(SAVE_URL, new Blob([JSON.stringify(payload("teilweise"))], { type:"application/json" })); state.dirty = false; persist(); } catch(e){}
});

$next.addEventListener("click", function(){
  var q = Q[state.schritt];
  if (q.type === "start" && !state.einwilligung) return;
  stopRec();
  if (q.type === "contact"){
    var kf = kontaktFehler();
    if (kf){ var fe = document.getElementById("kontaktfehler"); if (fe){ fe.textContent = kf; fe.style.display = "block"; fe.scrollIntoView({ behavior:"smooth", block:"center" }); } return; }
    $next.disabled = true; $next.textContent = "Wird gesendet …";
    save("vollständig").then(function(ok){
      if (!ok){ $next.disabled = false; $next.textContent = "Nochmal senden"; var e = document.getElementById("senderr"); if (!e){ e = el("p", { id:"senderr", "class":"err", text:"Senden hat nicht geklappt. Prüf kurz deine Verbindung und tipp nochmal auf „Nochmal senden“." }); $screen.appendChild(e); } e.style.display = "block"; return; }
      state.fertig = true; state.schritt += 1; persist(); render();
    });
    return;
  }
  if (q.type === "open" && NUDGE[q.id] && !nudged[q.id] && !String(state.a[q.key] || "").trim()){
    nudged[q.id] = 1;
    var nh = document.getElementById("nudge");
    if (!nh){ nh = el("div", { id:"nudge", "class":"nudge" }); $screen.appendChild(nh); }
    nh.textContent = "Ein Satz reicht schon 💛 Genau diese Erfahrungen helfen mir am meisten. Magst du kurz etwas schreiben oder einsprechen? Sonst tippe einfach nochmal auf „Weiter“.";
    nh.scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
  if (SAVE_AFTER[q.id]) save("teilweise");
  state.schritt += 1;
  while (state.schritt < Q.length - 1 && ueberspringen(Q[state.schritt])) state.schritt += 1;
  persist(); render();
});
$back.addEventListener("click", function(){ if (state.schritt > 0){ state.schritt -= 1; while (state.schritt > 0 && ueberspringen(Q[state.schritt])) state.schritt -= 1; persist(); render(); } });

render();
})();

<script>
(function(){

var params = new URLSearchParams(location.search);

function el(tag, attrs, kids){
  var n = document.createElement(tag); attrs = attrs || {};
  for (var k in attrs){ if (k === "text") n.textContent = attrs[k]; else if (k === "html") n.innerHTML = attrs[k]; else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]); }
  (kids || []).forEach(function(c){ if (c) n.appendChild(c); });
  return n;
}
function arr(key){ var v = state.a[key]; return Array.isArray(v) ? v : []; }
function setA(key, val){ state.a[key] = val; state.dirty = true; persist(); }

function optionButton(label, on, radio, onclick, disabled){
  var b = el("button", { type:"button", "class":"opt" + (radio ? " radio" : "") + (on ? " on" : ""), "aria-pressed": on ? "true" : "false", onclick:onclick }, [ el("span", { "class":"box" }), el("span", { text:label }) ]);
  if (disabled) b.setAttribute("disabled", "disabled");
  return b;
}

function renderChoiceList(container, key, options, display, multi, max, exclusive){
  var box = el("div", { "class":"opts" });
  options.forEach(function(o, i){
    var sel = multi ? arr(key).indexOf(o) > -1 : state.a[key] === o;
    var full = multi && max && arr(key).length >= max && !sel;
    box.appendChild(optionButton(display ? display[i] : o, sel, !multi, function(){
      if (multi){
        var cur = arr(key).slice(), idx = cur.indexOf(o);
        if (idx > -1) cur.splice(idx,1);
        else {
          if (exclusive && o === exclusive) cur = [];
          else if (exclusive) { var ex = cur.indexOf(exclusive); if (ex > -1) cur.splice(ex,1); }
          if (!max || cur.length < max) cur.push(o);
        }
        setA(key, cur);
      } else { setA(key, state.a[key] === o ? null : o); }
      render();
    }, full));
  });
  container.appendChild(box);
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, recOn = false;
function stopRec(){ if (rec && recOn){ try { rec.stop(); } catch(e){} } recOn = false; }
function micBlock(textarea, key){
  var frag = document.createDocumentFragment();
  if (SR){
    var btn = el("button", { type:"button", "class":"mic" });
    var setLabel = function(){ btn.innerHTML = (recOn ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Fertig gesprochen' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>Antwort einsprechen'); btn.classList.toggle("rec", recOn); };
    setLabel();
    btn.addEventListener("click", function(){
      if (recOn){ stopRec(); setLabel(); return; }
      try {
        rec = new SR(); rec.lang = "de-DE"; rec.continuous = true; rec.interimResults = true;
        var baseText = textarea.value ? textarea.value.replace(/\s*$/, " ") : "";
        var finals = "";
        rec.onresult = function(ev){
          var interim = "";
          for (var i = ev.resultIndex; i < ev.results.length; i++){
            if (ev.results[i].isFinal) finals += ev.results[i][0].transcript + " ";
            else interim += ev.results[i][0].transcript;
          }
          textarea.value = (baseText + finals + interim).replace(/\s+$/, interim ? "" : " ");
          setA(key, textarea.value.trim());
        };
        rec.onerror = function(ev){ recOn = false; setLabel(); if (ev && (ev.error === "not-allowed" || ev.error === "service-not-allowed")) showTip(true); };
        rec.onend = function(){ recOn = false; setLabel(); setA(key, textarea.value.trim()); };
        rec.start(); recOn = true; setLabel();
      } catch(e){ recOn = false; setLabel(); showTip(true); }
    });
    frag.appendChild(btn);
  }
  var tip = el("p", { "class":"small", text: SR ? "Du siehst deinen Text sofort und kannst ihn danach noch ändern. Alternativ: Mikrofon-Taste auf deiner Handy-Tastatur." : "Tipp: Tippe ins Feld und nutze das Mikrofon auf deiner Handy-Tastatur – dann kannst du einfach sprechen." });
  function showTip(blocked){ if (blocked) tip.textContent = "Das Mikrofon ist hier gesperrt. Kein Problem: Tippe ins Feld und nutze das Mikrofon auf deiner Handy-Tastatur."; }
  frag.appendChild(tip);
  return frag;
}

    el("p", { text:"Zweck: Entwicklung von Angeboten für Lehrkräfte (FoxFlow) und deren Bekanntmachung. Zitate nur ohne Namen. Rechtsgrundlage ist deine Einwilligung (Art. 6 Abs. 1 lit. a DSGVO); du kannst sie jederzeit widerrufen." }),
    el("p", { text:"Was gespeichert wird: deine Antworten, Zeitpunkt, Gerätetyp und über welchen Link du kamst. Name und Kontakt nur, wenn du sie freiwillig angibst. Bitte keine Gesundheitsangaben und keine Namen von Schüler:innen." }),
    el("p", { text:"Empfänger: unser Automatisierungsdienst (n8n) und unsere Datenbank (Airtable, USA). Die Spracheingabe nutzt die Diktierfunktion deines Browsers bzw. Handys (z. B. Apple oder Google); wir speichern keine Tonaufnahmen, nur den Text. Logo und Dankeschön-PDF werden über Google Drive geladen." }),
    el("p", { text:"Speicherdauer: höchstens 24 Monate, Kontaktdaten bis zu deinem Widerruf. Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung, Widerspruch, Datenübertragbarkeit und Beschwerde bei einer Datenschutz-Aufsichtsbehörde." })
  ]);
}
document.getElementById("dslink").addEventListener("click", function(ev){ ev.preventDefault(); if (state.schritt !== 0){ state.schritt = 0; persist(); render(); } var d = document.getElementById("ds"); if (d){ d.open = true; d.scrollIntoView({behavior:"smooth"}); } });

function geraet(){ var w = Math.min(screen.width, screen.height); var ua = navigator.userAgent || ""; if (/iPad|Tablet/i.test(ua) || (w >= 600 && /Mobi|Android/i.test(ua))) return "Tablet"; if (/Mobi|iPhone|Android/i.test(ua) || w < 600) return "Handy"; return "Computer"; }
function payload(status){
  return { sitzung: state.sitzung, status: status, test: IS_TEST, quelle: QUELLE, einwilligung: state.einwilligung, schritt: state.schritt, dauer: Math.round((Date.now() - state.start) / 1000), geraet: geraet(), antworten: state.a };
}
function save(status){
  if (!state.einwilligung) return Promise.resolve(true);
  var body = JSON.stringify(payload(status));
  return fetch(SAVE_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body:body, keepalive:true })
    .then(function(r){ if (r.ok){ state.dirty = false; state.saved = state.schritt; persist(); return true; } return false; })
    .catch(function(){ return false; });
}
window.addEventListener("pagehide", function(){
  if (!state.dirty || !state.einwilligung || state.fertig || state.schritt < 2) return;
  try { navigator.sendBeacon(SAVE_URL, new Blob([JSON.stringify(payload("teilweise"))], { type:"application/json" })); state.dirty = false; persist(); } catch(e){}
});

$next.addEventListener("click", function(){
  var q = Q[state.schritt];
  if (q.type === "start" && !state.einwilligung) return;
  stopRec();
  if (q.type === "contact"){
    var kf = kontaktFehler();
    if (kf){ var fe = document.getElementById("kontaktfehler"); if (fe){ fe.textContent = kf; fe.style.display = "block"; fe.scrollIntoView({ behavior:"smooth", block:"center" }); } return; }
    $next.disabled = true; $next.textContent = "Wird gesendet …";
    save("vollständig").then(function(ok){
      if (!ok){ $next.disabled = false; $next.textContent = "Nochmal senden"; var e = document.getElementById("senderr"); if (!e){ e = el("p", { id:"senderr", "class":"err", text:"Senden hat nicht geklappt. Prüf kurz deine Verbindung und tipp nochmal auf „Nochmal senden“." }); $screen.appendChild(e); } e.style.display = "block"; return; }
      state.fertig = true; state.schritt += 1; persist(); render();
    });
    return;
  }
  if (q.type === "open" && NUDGE[q.id] && !nudged[q.id] && !String(state.a[q.key] || "").trim()){
    nudged[q.id] = 1;
    var nh = document.getElementById("nudge");
    if (!nh){ nh = el("div", { id:"nudge", "class":"nudge" }); $screen.appendChild(nh); }
    nh.textContent = "Ein Satz reicht schon 💛 Genau diese Erfahrungen helfen mir am meisten. Magst du kurz etwas schreiben oder einsprechen? Sonst tippe einfach nochmal auf „Weiter“.";
    nh.scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
  if (SAVE_AFTER[q.id]) save("teilweise");
  state.schritt += 1; persist(); render();
});
$back.addEventListener("click", function(){ if (state.schritt > 0){ state.schritt -= 1; persist(); render(); } });

render();
})();
</script>
</body>
</html>
